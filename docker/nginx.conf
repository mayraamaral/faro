# nginx config for serving the Expo static web bundle.
#
# Tuned for Single-Page Applications (Expo Router uses HTML5 history mode):
#   * All unmatched paths fall back to /index.html so deep links resolve.
#   * Hash-based filenames under /_expo/static get long-lived caching.
#   * Everything else gets a short, safe cache.

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # gzip responses for text assets; small CPU win on slow networks.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # Hashed bundles — content-hash in the URL makes "immutable" safe.
  location /_expo/static/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Public assets folder emitted by Metro (images, fonts, etc.).
  location /assets/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: anything that isn't a real file is served by index.html
  # so Expo Router's typed routes resolve on hard refresh / deep links.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # Don't cache the entry HTML — Expo injects build-id / runtime hints.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
